name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SAFE_CHAIN_RELEASE: '1.5.24'
  SAFE_CHAIN_INSTALLER_SHA256: 99eb124a3404b3ac99e8b65406b87c4ee049c1d6c17757a7d04991ae60d16e69

jobs:
  test:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Aikido Safe Chain puts npm behind a proxy that refuses known malware and,
      # with the age set below, any package version published in the last 7 days.
      - name: Install Safe Chain
        run: |
          installer="$RUNNER_TEMP/install-safe-chain.sh"
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/$SAFE_CHAIN_RELEASE/install-safe-chain.sh" -o "$installer"
          echo "$SAFE_CHAIN_INSTALLER_SHA256  $installer" | sha256sum --check
          sh "$installer" --ci

      # The installer only warns when its setup fails, so check npm really goes through the proxy.
      - name: Install dependencies
        run: |
          if [ "$(command -v npm)" != "$HOME/.safe-chain/shims/npm" ]; then
            echo "::error::npm is not running through Safe Chain"
            exit 1
          fi
          npm ci
        env:
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 168

      # New headless loads extensions from the full Chromium build, so the headless shell is skipped.
      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run tests
        run: npm test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
